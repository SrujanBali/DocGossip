services:
  db_mysql:
    image: mysql:8.0
    container_name: docgossip_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./Backend
    container_name: docgossip_flask
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - MYSQL_URI=mysql+pymysql://root:${DB_PASSWORD}@db_mysql:3306/${DB_NAME}
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - db_mysql
volumes:
  mysql_data:
